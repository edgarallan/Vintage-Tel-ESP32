<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 620" role="img" aria-label="Identificazione fili disco">
<title>Identificazione fili del disco</title>
<desc>Schema per identificare con multimetro le coppie di fili NSI e Pulse del disco</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2C2C2A; }
  .t { font-size: 14px; }
  .ts { font-size: 12px; }
  .th { font-size: 14px; font-weight: 500; }
  .c-blue rect { fill: #E6F1FB; stroke: #185FA5; }
  .c-blue .th, .c-blue .t { fill: #0C447C; }
  .c-blue .ts { fill: #185FA5; }
  .c-red rect { fill: #FCEBEB; stroke: #A32D2D; }
  .c-red .th, .c-red .t { fill: #791F1F; }
  .c-red .ts { fill: #A32D2D; }
  .c-amber rect { fill: #FAEEDA; stroke: #BA7517; }
  .c-amber .th, .c-amber .t { fill: #633806; }
  .c-amber .ts { fill: #854F0B; }
  @media (prefers-color-scheme: dark) {
    text { fill: #D3D1C7; }
    .c-blue rect { fill: #0C447C; stroke: #85B7EB; }
    .c-blue .th, .c-blue .t { fill: #E6F1FB; }
    .c-blue .ts { fill: #85B7EB; }
    .c-red rect { fill: #791F1F; stroke: #F09595; }
    .c-red .th, .c-red .t { fill: #FCEBEB; }
    .c-red .ts { fill: #F09595; }
    .c-amber rect { fill: #633806; stroke: #FAC775; }
    .c-amber .th, .c-amber .t { fill: #FAEEDA; }
    .c-amber .ts { fill: #FAC775; }
  }
</style>

<text class="th" x="340" y="30" text-anchor="middle">Step 3 — identifica i fili del disco</text>
<text class="ts" x="340" y="50" text-anchor="middle">Usa il multimetro in continuità per riconoscere le coppie</text>

<rect x="160" y="80" width="360" height="200" rx="8" fill="none" stroke="#888780" stroke-width="0.8" stroke-dasharray="6 4"/>
<text class="ts" x="340" y="100" text-anchor="middle">Schema dei contatti dietro il disco</text>

<rect x="200" y="125" width="150" height="50" rx="6" fill="none" stroke="#888780" stroke-width="0.5"/>
<text class="th" x="275" y="155" text-anchor="middle">Pulse contact</text>

<rect x="200" y="195" width="150" height="50" rx="6" fill="none" stroke="#888780" stroke-width="0.5"/>
<text class="th" x="275" y="225" text-anchor="middle">NSI contact</text>

<line x1="200" y1="150" x2="170" y2="150" stroke="#E24B4A" stroke-width="2"/>
<line x1="350" y1="150" x2="380" y2="150" stroke="#E24B4A" stroke-width="2"/>
<circle cx="170" cy="150" r="3" fill="#E24B4A"/>
<circle cx="380" cy="150" r="3" fill="#E24B4A"/>
<text class="ts" x="160" y="154" text-anchor="end" fill="#A32D2D">F1</text>
<text class="ts" x="390" y="154" text-anchor="start" fill="#A32D2D">F2</text>

<line x1="200" y1="220" x2="170" y2="220" stroke="#378ADD" stroke-width="2"/>
<line x1="350" y1="220" x2="380" y2="220" stroke="#378ADD" stroke-width="2"/>
<circle cx="170" cy="220" r="3" fill="#378ADD"/>
<circle cx="380" cy="220" r="3" fill="#378ADD"/>
<text class="ts" x="160" y="224" text-anchor="end" fill="#185FA5">F3</text>
<text class="ts" x="390" y="224" text-anchor="start" fill="#185FA5">F4</text>

<text class="ts" x="450" y="260" text-anchor="middle">4 fili dal disco</text>

<g class="c-blue">
<rect x="40" y="310" width="290" height="130" rx="8" stroke-width="0.5"/>
<text class="th" x="185" y="334" text-anchor="middle">Test 1: contatto NSI</text>
<text class="ts" x="55" y="358">1. Disco fermo a riposo: chiuso</text>
<text class="ts" x="55" y="378">2. Inizia a ruotare: apre</text>
<text class="ts" x="55" y="398">3. Tutto il tempo della rotazione: aperto</text>
<text class="ts" x="55" y="418">4. Disco tornato a fine corsa: chiuso</text>
</g>

<g class="c-red">
<rect x="350" y="310" width="290" height="130" rx="8" stroke-width="0.5"/>
<text class="th" x="495" y="334" text-anchor="middle">Test 2: contatto Pulse</text>
<text class="ts" x="365" y="358">1. Disco fermo: chiuso</text>
<text class="ts" x="365" y="378">2. Durante andata: aperto continuo</text>
<text class="ts" x="365" y="398">3. Durante ritorno: apre/chiude N volte</text>
<text class="ts" x="365" y="418">4. N = cifra composta (10 = 0)</text>
</g>

<g class="c-amber">
<rect x="40" y="470" width="600" height="120" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="494" text-anchor="middle">Procedura pratica</text>
<text class="ts" x="55" y="518">1. Puntale fisso su un filo, sposta l'altro sui 3 rimanenti finché trovi continuità</text>
<text class="ts" x="55" y="538">2. Componi cifra "3" lentamente: la coppia che apre 3 volte è Pulse</text>
<text class="ts" x="55" y="558">3. L'altra coppia che apre solo durante la rotazione è NSI</text>
<text class="ts" x="55" y="578">4. Etichetta subito con strisce di carta + scotch</text>
</g>

</svg>
