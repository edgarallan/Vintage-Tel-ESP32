<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" role="img" aria-label="Apertura del telefono SIP">
<title>Apertura del telefono SIP</title>
<desc>Vista isometrica del telefono capovolto con le posizioni delle due viti sul fondo</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2C2C2A; }
  .t { font-size: 14px; }
  .ts { font-size: 12px; }
  .th { font-size: 14px; font-weight: 500; }
  .c-amber rect { fill: #FAEEDA; stroke: #BA7517; }
  .c-amber .th, .c-amber .t { fill: #633806; }
  .c-amber .ts { fill: #854F0B; }
  @media (prefers-color-scheme: dark) {
    text { fill: #D3D1C7; }
    .c-amber rect { fill: #633806; stroke: #FAC775; }
    .c-amber .th, .c-amber .t { fill: #FAEEDA; }
    .c-amber .ts { fill: #FAC775; }
  }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<text class="th" x="340" y="32" text-anchor="middle">Step 1 — apertura del telefono SIP</text>
<text class="ts" x="340" y="52" text-anchor="middle">Capovolgi il telefono e rimuovi le 2 viti sul fondo</text>

<g transform="translate(140, 110)">
<polygon points="60,140 60,80 100,40 340,40 380,80 380,140 340,180 100,180" fill="#888780" stroke="#2C2C2A" stroke-width="1"/>
<polygon points="60,80 100,40 340,40 380,80 340,120 100,120" fill="#B4B2A9" stroke="#2C2C2A" stroke-width="0.5"/>
<polygon points="60,140 100,180 340,180 380,140 340,100 100,100" fill="#5F5E5A" stroke="#2C2C2A" stroke-width="0.5"/>

<circle cx="140" cy="150" r="6" fill="#2C2C2A" stroke="#2C2C2A" stroke-width="0.5"/>
<line x1="136" y1="146" x2="144" y2="154" stroke="#F1EFE8" stroke-width="1"/>
<line x1="144" y1="146" x2="136" y2="154" stroke="#F1EFE8" stroke-width="1"/>

<circle cx="300" cy="150" r="6" fill="#2C2C2A" stroke="#2C2C2A" stroke-width="0.5"/>
<line x1="296" y1="146" x2="304" y2="154" stroke="#F1EFE8" stroke-width="1"/>
<line x1="304" y1="146" x2="296" y2="154" stroke="#F1EFE8" stroke-width="1"/>

<rect x="180" y="60" width="80" height="35" rx="3" fill="#444441" stroke="#2C2C2A" stroke-width="0.5"/>
<text class="ts" x="220" y="82" text-anchor="middle" fill="#D3D1C7">SIEMENS</text>
</g>

<line x1="280" y1="260" x2="200" y2="360" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="440" y1="260" x2="500" y2="360" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>

<g class="c-amber">
<rect x="80" y="370" width="240" height="80" rx="8" stroke-width="0.5"/>
<text class="th" x="200" y="395" text-anchor="middle">Vite sinistra</text>
<text class="ts" x="200" y="415" text-anchor="middle">Testa cilindrica PH1</text>
<text class="ts" x="200" y="433" text-anchor="middle">o cacciavite piatto 3mm</text>
</g>

<g class="c-amber">
<rect x="360" y="370" width="240" height="80" rx="8" stroke-width="0.5"/>
<text class="th" x="480" y="395" text-anchor="middle">Vite destra</text>
<text class="ts" x="480" y="415" text-anchor="middle">Stessa tipologia</text>
<text class="ts" x="480" y="433" text-anchor="middle">Conserva per rimontaggio</text>
</g>

</svg>
