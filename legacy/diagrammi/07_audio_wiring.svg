<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600" role="img" aria-label="Cablaggio audio">
<title>Cablaggio audio</title>
<desc>Schema delle connessioni audio I2S tra Pi, DAC, ADC e cornetta</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2C2C2A; }
  .t { font-size: 14px; }
  .ts { font-size: 12px; }
  .th { font-size: 14px; font-weight: 500; }
  .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
  .c-purple .th, .c-purple .t { fill: #3C3489; }
  .c-purple .ts { fill: #534AB7; }
  .c-coral rect { fill: #FAECE7; stroke: #993C1D; }
  .c-coral .th, .c-coral .t { fill: #712B13; }
  .c-coral .ts { fill: #993C1D; }
  .c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal .th, .c-teal .t { fill: #085041; }
  .c-teal .ts { fill: #0F6E56; }
  .c-amber rect { fill: #FAEEDA; stroke: #BA7517; }
  .c-amber .th, .c-amber .t { fill: #633806; }
  .c-amber .ts { fill: #854F0B; }
  @media (prefers-color-scheme: dark) {
    text { fill: #D3D1C7; }
    .c-purple rect { fill: #3C3489; stroke: #AFA9EC; }
    .c-purple .th, .c-purple .t { fill: #EEEDFE; }
    .c-purple .ts { fill: #AFA9EC; }
    .c-coral rect { fill: #712B13; stroke: #F0997B; }
    .c-coral .th, .c-coral .t { fill: #FAECE7; }
    .c-coral .ts { fill: #F0997B; }
    .c-teal rect { fill: #085041; stroke: #5DCAA5; }
    .c-teal .th, .c-teal .t { fill: #E1F5EE; }
    .c-teal .ts { fill: #5DCAA5; }
    .c-amber rect { fill: #633806; stroke: #FAC775; }
    .c-amber .th, .c-amber .t { fill: #FAEEDA; }
    .c-amber .ts { fill: #FAC775; }
  }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<text class="th" x="340" y="30" text-anchor="middle">Step 7 — connessioni audio</text>
<text class="ts" x="340" y="50" text-anchor="middle">DAC per lo speaker, ADC per il microfono via I2S</text>

<g class="c-purple">
<rect x="270" y="90" width="140" height="80" rx="8" stroke-width="0.8"/>
<text class="th" x="340" y="115" text-anchor="middle">Raspberry Pi</text>
<text class="ts" x="340" y="135" text-anchor="middle">BCK GPIO 18</text>
<text class="ts" x="340" y="152" text-anchor="middle">LRCK GPIO 19</text>
<text class="ts" x="340" y="169" text-anchor="middle">DOUT 21 / DIN 20</text>
</g>

<g class="c-coral">
<rect x="50" y="220" width="170" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="135" y="245" text-anchor="middle">PCM5102A</text>
<text class="ts" x="135" y="265" text-anchor="middle">DAC I2S → analog</text>
<text class="ts" x="135" y="282" text-anchor="middle">jumper FLT=0 DEMP=0</text>
</g>

<g class="c-coral">
<rect x="50" y="320" width="170" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="135" y="345" text-anchor="middle">PAM8302</text>
<text class="ts" x="135" y="365" text-anchor="middle">Amp mono 2.5W</text>
<text class="ts" x="135" y="382" text-anchor="middle">guadagno regolabile</text>
</g>

<g class="c-coral">
<rect x="460" y="220" width="170" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="545" y="245" text-anchor="middle">INMP441</text>
<text class="ts" x="545" y="265" text-anchor="middle">MEMS + ADC integrati</text>
<text class="ts" x="545" y="282" text-anchor="middle">L/R = GND (mono)</text>
</g>

<g class="c-teal">
<rect x="50" y="430" width="170" height="80" rx="8" stroke-width="0.5"/>
<text class="th" x="135" y="455" text-anchor="middle">Speaker cornetta</text>
<text class="ts" x="135" y="475" text-anchor="middle">originale</text>
<text class="ts" x="135" y="493" text-anchor="middle">50-200Ω 0.5W</text>
<text class="ts" x="135" y="508" text-anchor="middle">collegato diretto</text>
</g>

<g class="c-teal">
<rect x="460" y="430" width="170" height="80" rx="8" stroke-width="0.5"/>
<text class="th" x="545" y="455" text-anchor="middle">Microfono</text>
<text class="ts" x="545" y="475" text-anchor="middle">elettrete 9.7mm</text>
<text class="ts" x="545" y="493" text-anchor="middle">sostituisce capsula</text>
<text class="ts" x="545" y="508" text-anchor="middle">a carbone originale</text>
</g>

<line x1="270" y1="155" x2="220" y2="240" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="225" y="200" text-anchor="end" fill="#993C1D">I2S DOUT</text>

<line x1="135" y1="290" x2="135" y2="320" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="180" y="310" fill="#993C1D">analog</text>

<line x1="135" y1="390" x2="135" y2="430" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="180" y="415" fill="#993C1D">amplificato</text>

<line x1="410" y1="155" x2="460" y2="240" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="455" y="200" text-anchor="start" fill="#185FA5">I2S BCK + LRCK</text>

<line x1="545" y1="430" x2="545" y2="290" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="555" y="370" fill="#185FA5">acustica</text>

<line x1="220" y1="465" x2="460" y2="465" stroke="#888780" stroke-width="0.4" stroke-dasharray="4 4"/>
<text class="ts" x="340" y="460" text-anchor="middle">entrambi nella stessa cornetta</text>

<g class="c-amber">
<rect x="240" y="530" width="200" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="552" text-anchor="middle">3V3 alimentazione</text>
<text class="ts" x="340" y="572" text-anchor="middle">comune a DAC, ADC, amp</text>
</g>

</svg>
